<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="app-build" content="2026-09-16-test-blog-cards-architecture-final">
<meta name="test-data-file" content="test_data.json">
<title>Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    padding:2rem 1rem 4rem;
    background:#f5f7fa;
    color:#0f172a;
    font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
}
button,input,textarea{font:inherit}
[contenteditable="true"]{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
    width:min(100%,1100px);
    margin:auto;
    padding:2rem 1.8rem;
    background:#fff;
    border-radius:32px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.15);
}
.page-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    margin-bottom:1.45rem;
    padding-bottom:.8rem;
    border-bottom:2px solid #e8edf4;
    color:#1e293b;
    font-size:2.2rem;
    font-weight:600;
    letter-spacing:-.5px;
}
.cloud-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:.35rem .9rem;
    border-radius:999px;
    background:#f1f5f9;
    color:#475569;
    font-size:.82rem;
    font-weight:500;
}
.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#94a3b8;
}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:1.7rem;
    padding-bottom:1rem;
    border-bottom:1px solid #e8edf4;
}
.toolbar-group{display:flex;flex-wrap:wrap;gap:9px}
.btn{
    min-height:36px;
    padding:.45rem 1.1rem;
    border:1px solid #cbd5e1;
    border-radius:999px;
    background:#fff;
    color:#334155;
    font-size:.86rem;
    font-weight:650;
    transition:.15s;
}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{border-color:#1e293b;background:#1e293b;color:#fff}
.btn-primary:hover{background:#0f172a}
.btn-sync{border-color:#1E40AF;background:#1E40AF;color:#fff}
.btn-sync:hover{border-color:#1E3A8A;background:#1E3A8A}
.btn-danger{border-color:#fecaca;background:#fee2e2;color:#991b1b}
.btn-danger:hover{background:#fecaca}
.last-sync{color:#94a3b8;font-size:.8rem}

.visitor-note{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    margin:-.55rem 0 .75rem;
    color:#94a3b8;
    font-size:.76rem;
}
.visitor-login-link{
    padding:0;
    border:0;
    background:transparent;
    color:#94a3b8;
    font-size:.76rem;
    text-decoration:underline;
    text-underline-offset:2px;
}
.visitor-login-link:hover{color:#64748b}

.add-section{
    margin-bottom:2rem;
    padding:1.5rem;
    border:1px solid #e2e8f0;
    border-radius:24px;
    background:#f8fafc;
}
.add-section h2{margin-bottom:1rem;font-size:1.3rem}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{
    color:#475569;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.04em;
}

.title-field-label{color:#475569;font-size:.78rem;font-weight:700;letter-spacing:.04em}
.title-options{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;min-height:44px;padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:15px;background:#fff}
.title-choice{display:inline-flex;align-items:center;gap:7px;color:#334155;font-size:.9rem!important;font-weight:400!important;letter-spacing:0!important;cursor:pointer;user-select:none}
.title-choice input{appearance:none;-webkit-appearance:none;width:17px!important;height:17px!important;min-height:17px!important;margin:0!important;padding:0!important;border:1.5px solid #94a3b8!important;border-radius:3px!important;background:#fff!important;box-shadow:none!important;cursor:pointer}
.title-choice input:checked{border-color:#1E40AF!important;background:#1E40AF!important;box-shadow:inset 0 0 0 3px #fff!important}
.title-choice input:focus-visible{outline:2px solid #93c5fd!important;outline-offset:2px}
.rich-editor-wrap{
    position:relative;
    overflow:hidden;
    border:1px solid #cbd5e1;
    border-radius:16px;
    background:#fff;
}
.rich-editor-wrap:focus-within{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.rich-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:.55rem;
    border-bottom:1px solid #e2e8f0;
    background:#f8fafc;
}
#contentToolbar,
#editToolbar{
    border-top:1px solid #e2e8f0;
    border-bottom:0;
}
.editor-btn{
    min-width:34px;
    min-height:32px;
    padding:.28rem .62rem;
    border:1px solid #cbd5e1;
    border-radius:9px;
    background:#fff;
    color:#334155;
    font-size:.8rem;
    font-weight:650;
}
.editor-btn:hover{background:#eef2f7}
.editor-btn:active{transform:translateY(1px)}
.rich-editor{
    width:100%;
    min-height:8.4rem;
    max-height:420px;
    overflow-y:scroll;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:#94a3b8 #f1f5f9;
    padding:.9rem 1rem;
    color:#0f172a;
    outline:none;
    line-height:1.75;
    overflow-wrap:anywhere;
}
.rich-editor::-webkit-scrollbar{
    width:10px;
}
.rich-editor::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-left:1px solid #e2e8f0;
}
.rich-editor::-webkit-scrollbar-thumb{
    min-height:42px;
    background:#94a3b8;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
.rich-editor::-webkit-scrollbar-thumb:hover{background:#64748b}
/* 原生滚动条在部分桌面系统、iOS 和安卓浏览器中会自动隐藏。
   因此正文编辑区始终配套一个可见且可拖动的滚动条；只有内容溢出时才显示。 */
.rich-editor-scrollbar{
    position:absolute;
    right:3px;
    z-index:6;
    display:block;
    width:7px;
    border-radius:999px;
    background:rgba(148,163,184,.28);
    opacity:0;
    pointer-events:none;
    touch-action:none;
    cursor:pointer;
    transition:opacity .15s ease;
}
.rich-editor-scrollbar.visible{
    opacity:.95;
    pointer-events:auto;
}
.rich-editor-scrollbar-thumb{
    position:absolute;
    inset:0 auto auto 0;
    width:100%;
    min-height:34px;
    border-radius:999px;
    background:#64748b;
    transform:translateY(0);
    cursor:grab;
    touch-action:none;
}
.rich-editor-scrollbar-thumb:active{cursor:grabbing}
.rich-editor p,.rich-editor div,.cards-content p,.cards-content div{margin:.3em 0}
.rich-editor ul,.rich-editor ol,.cards-content ul,.cards-content ol{padding-left:1.7em;margin:.45em 0}
.rich-editor blockquote,.cards-content blockquote{
    margin:.55em 0;
    padding:.25em .8em;
    border-left:3px solid #cbd5e1;
    color:#475569;
}
.rich-editor hr,.cards-content hr{
    margin:1em 0;
    border:0;
    border-top:1px solid #cbd5e1;
}
.first-line-indent{text-indent:2em}
.add-button{
    width:100%;
    min-height:46px;
    margin-top:1rem;
    border:0;
    border-radius:999px;
    background:#1e293b;
    color:#fff;
    font-weight:700;
}
.add-button:hover{background:#0f172a}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
    margin:1.8rem 0 .8rem;
}
.list-header h2{
    color:#0f172a;
    font-size:1.5rem;
    font-weight:600;
}
.count-badge{
    padding:.2rem 1rem;
    border-radius:40px;
    background:#e9edf4;
    color:#334155;
    text-align:center;
    font-size:.9rem;
    font-weight:500;
}

.cards-list{
    display:flex;
    flex-direction:column;
    gap:1.25rem;
    overflow:visible;
    margin-top:.5rem;
    border:0;
    border-radius:0;
    background:transparent;
}
.cards-item{
    width:100%;
    min-width:0;
    padding:1.35rem 1.4rem 1.5rem;
    border:1px solid #e2e8f0;
    border-radius:20px;
    background:#fff;
    overflow:visible;
    transition:background .15s;
}
.cards-item::after{content:"";display:block;clear:both}
.cards-item > *{max-width:100%}
.cards-title,.cards-content,.cards-code{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.cards-item:hover{background:#fafcff}
.cards-title{
    margin-bottom:.45rem;
    color:#1E40AF;
    font-size:1.05rem;
    font-weight:600;
    line-height:1.45;
    overflow-wrap:anywhere;
}
.cards-content{
    clear:both;
    overflow-wrap:anywhere;
    color:#0f172a;
    font-size:1rem;
    font-weight:400;
    line-height:1.68;
}
.cards-content a{color:#1E40AF;text-decoration:none}
.cards-content a:hover,.cards-content a:focus-visible{color:#1E3A8A;text-decoration:underline;outline:none}

/* 数学公式：与 Demo / Note / Repo 统一使用 MathJax CHTML；长公式允许横向滚动。 */
.cards-content mjx-container[jax="CHTML"]{
    max-width:100%;
    vertical-align:middle;
}
.cards-content mjx-container[display="true"]{
    display:block!important;
    max-width:100%;
    margin:.8em 0!important;
    padding:0!important;
    overflow-x:auto;
    overflow-y:hidden;
    text-align:center;
}
.rich-editor img,.cards-content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:.75em auto;
    border-radius:10px;
}
.rich-editor table,.cards-content table{
    width:100%;
    margin:.8em 0;
    border-collapse:collapse;
    table-layout:auto;
}
.rich-editor th,.rich-editor td,.cards-content th,.cards-content td{
    min-width:3em;
    padding:.38em .55em;
    border:1px solid #cbd5e1;
    vertical-align:top;
}
.rich-editor th,.cards-content th{background:#f8fafc;font-weight:700}
 .cards-footer{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    width:100%;
    margin-top:.65rem;
}
.cards-code{
    min-width:0;
    flex:1 1 auto;
    color:#64748b;
    font-size:.82rem;
    font-weight:400;
    line-height:1.5;
    overflow-wrap:anywhere;
}
.item-actions{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    gap:6px;
    margin-left:auto;
}
.action-btn{
    padding:.28rem .72rem;
    border:0;
    border-radius:999px;
    font-size:.82rem;
    font-weight:650;
}
.edit-btn{
    padding:0;
    border-radius:0;
    background:transparent;
    color:#64748b;
    font-weight:500;
    text-decoration:none;
}
.edit-btn:hover,
.edit-btn:focus-visible{
    background:transparent;
    color:#1e3a8a;
    text-decoration:none;
    outline:none;
}
.delete-btn{background:#fee2e2;color:#991b1b}
.delete-btn:hover{background:#fecaca}
.empty-state{
    padding:2.5rem 1rem;
    background:#fafcff;
    color:#94a3b8;
    text-align:center;
    font-size:1.05rem;
}
.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
            max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(5px);
}
.dialog{
    position:relative;
    width:min(100%,620px);
    max-height:calc(var(--cards-visible-height,100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#fff;
    border-radius:26px;
    box-shadow:0 30px 70px rgba(15,23,42,.28);
}
.dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:scroll;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:#94a3b8 #f1f5f9;
    padding:1.7rem 1.7rem 1rem;
}
.dialog-scroll::-webkit-scrollbar{width:10px}
.dialog-scroll::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-left:1px solid #e2e8f0;
}
.dialog-scroll::-webkit-scrollbar-thumb{
    min-height:42px;
    background:#94a3b8;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
.dialog-scroll::-webkit-scrollbar-thumb:hover{background:#64748b}
.dialog h3{margin-bottom:.4rem;font-size:1.3rem}
.dialog-desc{
    margin-bottom:1rem;
    padding-bottom:.8rem;
    border-bottom:1px solid #e2e8f0;
    color:#64748b;
    font-size:.86rem;
    line-height:1.6;
}
.dialog .form-group{margin-bottom:.95rem}
.dialog input{
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none;
}
.dialog input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.dialog-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:.95rem 1.7rem max(.95rem,env(safe-area-inset-bottom));
    border-top:1px solid #e8edf4;
    background:#fff;
}

/* Test 编辑弹窗：删除在左，取消/保存在右；删除与保存形成左右对称 */
#editModal .dialog-actions{
    justify-content:flex-end;
}
#editModal #editDelete{
    margin-right:auto;
}
#editModal .dialog-actions .btn{
    flex:0 0 auto;
}

/* 编辑弹窗标题选项与新增区保持同一套四选项布局。 */
#editModal .title-options{display:grid;grid-template-columns:repeat(4,max-content);align-items:center;column-gap:24px;row-gap:10px;min-height:44px}
@media(max-width:520px){#editModal .title-options{grid-template-columns:repeat(2,max-content)}}

/* 登录配置弹窗：内容独立滚动，底部按钮始终保留在可见区域 */
#configModal{
    overflow:hidden;
}
#configForm{
    height:min(720px,calc(var(--cards-visible-height,100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    max-height:calc(var(--cards-visible-height,100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
}
#configForm .dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
}
#configForm .dialog-scroll::-webkit-scrollbar{
    width:10px;
}
#configForm .dialog-scroll::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-radius:999px;
}
#configForm .dialog-scroll::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
#configForm .dialog-actions{
    flex:0 0 auto;
    position:relative;
    z-index:2;
    margin-top:0;
    box-shadow:0 -8px 20px rgba(15,23,42,.06);
}
.remember-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:#334155;
    font-size:.82rem;
    line-height:1.5;
}
.remember-row input{
    width:auto;
    min-height:auto;
    margin-top:.2rem;
    accent-color:#1E40AF;
}

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:1500;
    max-width:min(90vw,680px);
    padding:.78rem 1.5rem;
    transform:translateX(-50%);
    border-radius:999px;
    background:#1E40AF;
    color:#fff;
    font-size:.88rem;
    font-weight:600;
    text-align:center;
    box-shadow:0 12px 34px rgba(15,23,42,.25);
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#1E40AF}

.back-to-top {
    position: fixed;
    right: 18px;
    top: 70%;
    width: 30px;
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(-50%);
    z-index: 900;
    border: 0;
    border-radius: 50%;
    background: #1E40AF;
    color: #1E40AF;
    font-family: inherit;
    font-size: 0;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease, background 0.2s ease,
        color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.back-to-top.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}
.back-to-top:hover,
.back-to-top:focus-visible {
    opacity: 1;
    color: #1E3A8A;
    background: #1E3A8A;
    transform: translateY(-50%) translateX(-2px);
    outline: none;
}
@media(max-width:700px){
    body{padding:.8rem}
    .container{padding:1.25rem;border-radius:22px}
    .page-title{font-size:1.8rem}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-group{justify-content:center}
    .last-sync{text-align:center}
    .add-section{padding:1.2rem}
    /* 手机端固定编辑区高度，让手指始终在编辑框内部滚动，而不是把整页越撑越长。 */
    .rich-editor{
        min-height:170px;
        height:clamp(170px,36dvh,300px);
        max-height:300px;
        overflow-y:scroll;
        padding-right:.8rem;
    }
    .rich-editor::-webkit-scrollbar{width:8px}
    .rich-editor::-webkit-scrollbar-thumb{min-height:48px}
    .rich-editor-scrollbar{
        right:3px;
        width:6px;
    }
    .editor-btn{padding:.26rem .52rem}
    .cards-item{padding:1.05rem 1rem 1.2rem}
    .cards-title{font-size:1.05rem}
    .cards-content{font-size:1rem}
    .dialog{width:100%;border-radius:20px}
    .dialog-scroll{padding:1.2rem 1.2rem .8rem}
    .dialog-actions{padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom))}
    #editModal{
        align-items:stretch;
        overflow:hidden;
        padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
                max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    }
    #editModal .dialog{
        width:100%;
        height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        margin:auto 0;
    }
    #editModal .dialog-scroll{
        flex:1 1 auto;
        min-height:0;
        overflow-y:scroll;
    }
    .dialog-actions .btn{flex:1}
    #configModal{
        align-items:stretch;
        padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
                max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    }
    #configForm{
        width:100%;
        height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius:20px;
    }
    #configForm .dialog-scroll{
        padding:1.2rem 1.2rem .8rem;
    }
    #configForm .dialog-actions{
        padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom));
    }
    .back-to-top {
        right: 8px;
        top: 70%;
        width: 29px;
        height: 29px;
        padding: 0;
        font-size: 0.68rem;
    }
}

.print-select-mode .print-check{display:inline-block!important}
.print-check{
 display:none;
 width:16px;
 height:16px;
 margin-right:.55rem;
 vertical-align:middle;
}

</style>
</head>
<body>
<main class="container">
    <h1 class="page-title">
        Test

// ---------- 通用工具 ----------
function clean(v){return String(v??'').normalize('NFKC').trim()}
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function attr(v){return esc(v).replace(/"/g,'&quot;')}
function uid(){
    return crypto?.randomUUID
        ? crypto.randomUUID()
        : `test_${Date.now()}_${Math.random().toString(36).slice(2,10)}`;
}
function validIso(v){
    const s=clean(v);
    return s&&!Number.isNaN(Date.parse(s))?new Date(s).toISOString():'';
}
const ALLOWED_TAGS=new Set(['B','STRONG','I','EM','U','S','STRIKE','P','DIV','BR','HR','UL','OL','LI','BLOCKQUOTE','IMG','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','CAPTION']);
function normalizeHttpUrl(value){
    const url=String(value??'').trim();
    return /^https?:\/\/[^\s<>()]+$/i.test(url)?url:'';
}
function normalizeImageSrc(value){
    const src=String(value??'').trim();
    if(!src||/[<>"']/u.test(src))return '';
    if(/^(?:javascript|data|file):/i.test(src))return '';
    if(/^\/\//.test(src))return '';
    if(/^blob:/i.test(src)||/^https?:\/\//i.test(src))return src;
    if(/^[a-z][a-z0-9+.-]*:/i.test(src))return '';
    return src;
}
function anchorToMarkdownText(anchor){
    const label=(anchor.textContent||'').replace(/\u00a0/g,' ').trim();
    const url=normalizeHttpUrl(anchor.getAttribute('href'));
    if(!url)return label;
    if(/^\[[^\]\r\n]+\]\(https?:\/\/[^\s<>()]+\)$/i.test(label))return label;
    return `[${label||url}](${url})`;
}
function replaceAnchorsWithMarkdown(root){
    [...root.querySelectorAll('a')].forEach(anchor=>{
        anchor.replaceWith(document.createTextNode(anchorToMarkdownText(anchor)));
    });
}
function sanitizeHtml(value){
    const template=document.createElement('template');
    template.innerHTML=String(value??'');

    // 存储层永远不保存 <a>：任何现有/粘贴进来的链接都还原为 [文字](链接)。
    replaceAnchorsWithMarkdown(template.content);

    const cleanNode=node=>{
        for(const child of [...node.childNodes]){
            if(child.nodeType===Node.COMMENT_NODE){
                child.remove();
                continue;
            }
            if(child.nodeType!==Node.ELEMENT_NODE)continue;

            const tag=child.tagName.toUpperCase();
            if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED'||tag==='LINK'||tag==='META'){
                child.remove();
                continue;
            }
            cleanNode(child);
            if(!ALLOWED_TAGS.has(tag)){
                child.replaceWith(...child.childNodes);
                continue;
            }

            const keepIndent=(tag==='P'||tag==='DIV')&&child.classList.contains('first-line-indent');
            const imageSrc=tag==='IMG'?normalizeImageSrc(child.getAttribute('src')):'';
            const imageAlt=tag==='IMG'?String(child.getAttribute('alt')||'').slice(0,300):'';
            const uploadToken=tag==='IMG'&&/^img_[a-z0-9_-]+$/i.test(child.getAttribute('data-upload-token')||'')
                ? child.getAttribute('data-upload-token')
                : '';
            for(const attribute of [...child.attributes])child.removeAttribute(attribute.name);
            if(keepIndent)child.className='first-line-indent';
            if(tag==='IMG'){
                if(!imageSrc){child.remove();continue;}
                child.setAttribute('src',imageSrc);
                if(imageAlt)child.setAttribute('alt',imageAlt);
                if(uploadToken)child.setAttribute('data-upload-token',uploadToken);
            }
        }
    };

    cleanNode(template.content);
    return template.innerHTML.trim();
}
function renderMarkdownLinks(value){
    const template=document.createElement('template');
    template.innerHTML=sanitizeHtml(value);
    const regex=/\[([^\]\r\n]+)\]\((https?:\/\/[^\s<>()]+)\)/gi;
    const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);

    for(const node of nodes){
        const text=node.nodeValue||'';
        regex.lastIndex=0;
        if(!regex.test(text))continue;
        regex.lastIndex=0;
        const fragment=document.createDocumentFragment();
        let last=0,match;
        while((match=regex.exec(text))){
            if(match.index>last)fragment.appendChild(document.createTextNode(text.slice(last,match.index)));
            const link=document.createElement('a');
            link.href=match[2];
            link.target='_blank';
            link.rel='noopener noreferrer';
            link.textContent=match[1];
            fragment.appendChild(link);
            last=regex.lastIndex;
        }
        if(last<text.length)fragment.appendChild(document.createTextNode(text.slice(last)));
        node.replaceWith(fragment);
    }
    return template.innerHTML;
}
function clipboardHtmlToMarkdownText(html,fallback=''){
    const template=document.createElement('template');
    template.innerHTML=String(html||'');
    const blockTags=new Set(['P','DIV','LI','BLOCKQUOTE','UL','OL','H1','H2','H3','H4','H5','H6','PRE']);
    const read=node=>{
        if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||'';
        if(node.nodeType!==Node.ELEMENT_NODE&&node.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return '';

            const tag=node.tagName.toUpperCase();
            if(tag==='BR')return '\n';
            if(tag==='A')return anchorToMarkdownText(node);
            let inner=[...node.childNodes].map(read).join('');
            if(blockTags.has(tag)&&inner&&!inner.endsWith('\n'))inner+='\n';
            return inner;
        }
        return [...node.childNodes].map(read).join('');
    };
    const result=read(template.content).replace(/\r\n?/g,'\n').replace(/\n{3,}/g,'\n\n').trim();

function looksLikeLatexPlainText(text){
    const s=String(text||'');
    if(!s)return false;
    if(/\$\$[\s\S]+?\$\$/.test(s))return true;
    if(/\$(?!\$)(?:\\.|[^$\r\n])+?\$/.test(s))return true;
    if(/\\\([\s\S]+?\\\)/.test(s))return true;
    if(/\\\[[\s\S]+?\\\]/.test(s))return true;
    return /\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|iint|iiint|oint|lim|log|ln|sin|cos|tan|arcsin|arccos|arctan|alpha|beta|gamma|delta|epsilon|varepsilon|theta|vartheta|lambda|mu|nu|xi|pi|rho|sigma|tau|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|mathrm|mathbf|mathit|mathbb|mathcal|text|operatorname|begin|end|left|right|cdot|times|div|pm|mp|leq|geq|neq|approx|equiv|infty|partial|nabla|overline|underline|hat|widehat|bar|vec|dot|ddot|boxed)\b/.test(s);
}
function clipboardTextForEditor(plain,html){
    const rawPlain=String(plain??'');

        let index=0;
        const tryNext=()=>{
            if(index>=MATHJAX_SOURCES.length){
                reject(new Error('数学公式渲染器加载失败'));
                return;
            }
            const script=document.createElement('script');
            script.src=MATHJAX_SOURCES[index++];
            script.defer=true;
            script.crossOrigin='anonymous';
            script.onload=()=>{
                if(window.MathJax&&typeof window.MathJax.typesetPromise==='function')resolve(window.MathJax);
                else{script.remove();tryNext();}
            };
            script.onerror=()=>{script.remove();tryNext();};
            document.head.appendChild(script);
        };
        tryNext();
    });
    return mathJaxLoadPromise;
}
function clearTypesetMath(container){
    if(window.MathJax&&typeof window.MathJax.typesetClear==='function'){
        try{window.MathJax.typesetClear([container]);}catch(error){console.warn('清理公式渲染状态失败',error);}
    }
}
function queueMathTypeset(container,version){
    const rawHtml=container.innerHTML;
    ensureMathJax().then(async mathJax=>{
        if(version!==mathRenderVersion||!container.isConnected)return;
        const ready=mathJax.startup&&mathJax.startup.promise?mathJax.startup.promise:Promise.resolve();
        try{
            await ready;
            await mathJax.typesetPromise([container]);
        }catch(error){
            console.error('数学公式渲染失败',error);
            if(version===mathRenderVersion&&container.isConnected)container.innerHTML=rawHtml;
        }
    }).catch(error=>{
        console.error(error);
        if(version===mathRenderVersion&&container.isConnected)container.innerHTML=rawHtml;
    });
}

function plainTextToHtml(value){
    const text=String(value??'').replace(/\r\n?/g,'\n').trim();
    return text?esc(text).replace(/\n/g,'<br>'):'';
}
function htmlToText(value){
    const div=document.createElement('div');
    div.innerHTML=sanitizeHtml(value);
    return (div.textContent||'').replace(/\u00a0/g,' ').trim();
}
function hasMeaningfulContent(value){
    const html=sanitizeHtml(value);
    if(htmlToText(html))return true;
    const div=document.createElement('div');
    div.innerHTML=html;
    return Boolean(div.querySelector('img,table'));
}

function normalizeAttachmentFolder(value){
    const raw=String(value??'').trim();
    if(!/^\d{10}$/.test(raw))return null;
    const timestamp=Number(raw);
    return Number.isSafeInteger(timestamp)&&timestamp>=UNIX_FOLDER_MIN&&timestamp<=UNIX_FOLDER_MAX
        ? timestamp
        : null;
}
function unixCodeFromCreatedAt(value){
    const ms=Date.parse(String(value||''));
    if(!Number.isFinite(ms))return '';
    const seconds=Math.floor(ms/1000);
    return String(seconds).padStart(10,'0').slice(0,8);
}
function normalizeEntry(x){
    if(!x||typeof x!=='object')return null;
    const id=clean(x.id)||uid();
    // 旧 Test JSON 若仍有 subject，只在读取入口映射一次；新模型不再保存 subject 字段。
    const title=normalizeTitleValue(x.title)||normalizeTitleValue(x.subject);
    const source=String(x.source??'').trim();
    const raw=String(x.content??'').trim();
    const content=x.contentFormat==='html'?sanitizeHtml(raw):plainTextToHtml(raw);
    const createdAt=validIso(x.createdAt);
    if(!title||!hasMeaningfulContent(content)||!createdAt)return null;
    return{
        id,
        attachmentFolder:normalizeAttachmentFolder(x.attachmentFolder),
        code:unixCodeFromCreatedAt(createdAt),
        title,
        source,
        content,
        contentFormat:'html',
        createdAt
    };
}
function compareTestEntries(a,b){
    // 唯一排序规则：语文 → 数学 → 英语 → 科学；各组内 Unix 时间戳前八位倒序。
    const ai=TITLE_VALUES.indexOf(normalizeTitleValue(a.title));
    const bi=TITLE_VALUES.indexOf(normalizeTitleValue(b.title));
    if(ai!==bi)return ai-bi;
    const ac=unixCodeFromCreatedAt(a.createdAt);
    const bc=unixCodeFromCreatedAt(b.createdAt);
    if(ac!==bc)return bc.localeCompare(ac);
    const byTime=Date.parse(b.createdAt)-Date.parse(a.createdAt);
    if(byTime!==0)return byTime;
    return String(b.id).localeCompare(String(a.id));
}

function normalizeState(value){
    const source=Array.isArray(value)?value:(value&&Array.isArray(value.entries)?value.entries:[]);
    const entries=source.map(normalizeEntry).filter(Boolean).sort(compareTestEntries);
    const used=new Set();
    for(const item of entries){
        const folder=normalizeAttachmentFolder(item.attachmentFolder);
        if(folder!==null&&!used.has(folder)){item.attachmentFolder=folder;used.add(folder);}
        else item.attachmentFolder=null;
    }
    return entries;
}
function allocateAttachmentFolder(){
    const used=new Set(
        state.map(item=>normalizeAttachmentFolder(item.attachmentFolder)).filter(folder=>folder!==null)
    );
    let timestamp=Math.floor(Date.now()/1000);
    if(timestamp<UNIX_FOLDER_MIN||timestamp>UNIX_FOLDER_MAX){
        throw new Error('当前时间无法生成 10 位 Unix 附件目录');
    }
    while(used.has(timestamp)&&timestamp<UNIX_FOLDER_MAX)timestamp++;
    if(used.has(timestamp)||timestamp>UNIX_FOLDER_MAX){
        throw new Error('无法生成唯一的 Unix 附件目录');
    }
    return timestamp;
}
function fingerprint(value=state){
    return JSON.stringify(normalizeState(value));
}
function formatDate(iso){
    const d=new Date(iso);
    if(Number.isNaN(d.getTime()))return '';
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

function openAppDb(){
    if(appDbPromise)return appDbPromise;
    appDbPromise=new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
        const request=indexedDB.open(APP_DB_NAME,APP_DB_VERSION);
        request.onupgradeneeded=()=>{
            const db=request.result;
            if(!db.objectStoreNames.contains(APP_STORE))db.createObjectStore(APP_STORE,{keyPath:'key'});
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error('IndexedDB open failed'));
    });
    return appDbPromise;
}
async function enqueueAppPut(key,value){
    appWriteChain=appWriteChain.catch(()=>{}).then(async()=>{
        const db=await openAppDb();
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(APP_STORE,'readwrite');
            tx.objectStore(APP_STORE).put({key:String(key),value:String(value)});
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
        });
    });
    return appWriteChain;
}
async function enqueueAppDelete(key){
    appWriteChain=appWriteChain.catch(()=>{}).then(async()=>{
        const db=await openAppDb();
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(APP_STORE,'readwrite');
            tx.objectStore(APP_STORE).delete(String(key));
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB delete failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB delete aborted'));
        });
    });
    return appWriteChain;
}
function appGet(key){
    const k=String(key);
    return appCache.has(k)?appCache.get(k):null;
}
function appSet(key,value){
    const k=String(key),v=String(value);
    appCache.set(k,v);
    return enqueueAppPut(k,v);
}
function appDelete(key){
    const k=String(key);
    appCache.delete(k);
    return enqueueAppDelete(k);
}
async function readWorkingCopyOpfs(){
    if(!navigator.storage?.getDirectory)return null;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(WORK_OPFS_FILE);
        const file=await handle.getFile();
        const record=JSON.parse(await file.text());
        return record&&typeof record==='object'&&typeof record.cacheJson==='string'?record:null;
    }catch(error){return null;}
}
function queueWorkingCopyOpfsWrite(snapshot=state){
    const normalized=normalizeState(snapshot);
    const record={
        savedAt:Date.now(),
        fingerprint:fingerprint(normalized),
        cacheJson:JSON.stringify(normalized)
    };
    workingCopyOpfsRecord=record;
    workingCopyOpfsWriteChain=workingCopyOpfsWriteChain.catch(()=>{}).then(async()=>{
        if(!navigator.storage?.getDirectory)return false;
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(WORK_OPFS_FILE,{create:true});
        const writable=await handle.createWritable();
        await writable.write(JSON.stringify(record));
        await writable.close();
        return true;
    }).catch(error=>{
        console.warn('OPFS 工作副本写入失败',error);
        return false;
    });
    return workingCopyOpfsWriteChain;
}
async function initAppStorage(){
    const db=await openAppDb();
    await new Promise((resolve,reject)=>{
        const tx=db.transaction(APP_STORE,'readonly');
        const request=tx.objectStore(APP_STORE).getAll();
        request.onsuccess=()=>{
            appCache.clear();
            for(const row of request.result||[])appCache.set(String(row.key),String(row.value??''));
            resolve();
        };
        request.onerror=()=>reject(request.error||new Error('IndexedDB read failed'));
    });
    try{if(navigator.storage?.persist)await navigator.storage.persist();}catch(error){}
    workingCopyOpfsRecord=await readWorkingCopyOpfs();
    if(appGet(WORK_CACHE_KEY)===null&&workingCopyOpfsRecord?.cacheJson){
        appCache.set(WORK_CACHE_KEY,String(workingCopyOpfsRecord.cacheJson));
        await enqueueAppPut(WORK_CACHE_KEY,String(workingCopyOpfsRecord.cacheJson));
    }
}
async function persistWorkingCopyNow(snapshot=state){
    const normalized=normalizeState(snapshot);
    const json=JSON.stringify(normalized);
    appCache.set(WORK_CACHE_KEY,json);
    const idbPromise=enqueueAppPut(WORK_CACHE_KEY,json);
    const opfsPromise=queueWorkingCopyOpfsWrite(normalized);
    const results=await Promise.allSettled([idbPromise,opfsPromise]);
    if(results[0].status==='rejected')throw results[0].reason||new Error('IndexedDB 工作副本写入失败');
    return normalized;
}

function formatError(error){

    if(error.status===401)return 'Token 无效或已过期';
    if(error.status===403)return 'Token 权限不足或仓库访问被拒绝';

function draftRecordValid(record){
    return !!record&&typeof record==='object'&&['draft','tombstone'].includes(record.kind)&&Number(record.savedAt)>0;
}
function openDraftDb(){
    return new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}
        const request=indexedDB.open(DRAFT_DB_NAME,DRAFT_DB_VERSION);
        request.onupgradeneeded=()=>{
            const db=request.result;
            if(!db.objectStoreNames.contains(DRAFT_STORE))db.createObjectStore(DRAFT_STORE,{keyPath:'key'});
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error||new Error('IndexedDB open failed'));
    });
}
async function draftDbRead(key){
    const db=await openDraftDb();
    try{
        return await new Promise((resolve,reject)=>{
            const tx=db.transaction(DRAFT_STORE,'readonly');
            const req=tx.objectStore(DRAFT_STORE).get(key);
            req.onsuccess=()=>resolve(req.result?.record||null);
            req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
        });
    }finally{db.close();}
}
async function draftDbWrite(key,record){
    const db=await openDraftDb();
    try{
        await new Promise((resolve,reject)=>{
            const tx=db.transaction(DRAFT_STORE,'readwrite');
            tx.objectStore(DRAFT_STORE).put({key,record});
            tx.oncomplete=()=>resolve();
            tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));
            tx.onabort=()=>reject(tx.error||new Error('IndexedDB write aborted'));
        });
    }finally{db.close();}
}
async function draftOpfsRead(fileName){
    if(!navigator.storage?.getDirectory)return null;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(fileName);
        const file=await handle.getFile();
        const record=JSON.parse(await file.text());
        return draftRecordValid(record)?record:null;
    }catch(error){return null;}
}
async function draftOpfsWrite(fileName,record){
    if(!navigator.storage?.getDirectory)return false;
    try{
        const root=await navigator.storage.getDirectory();
        const handle=await root.getFileHandle(fileName,{create:true});
        const writable=await handle.createWritable();
        await writable.write(JSON.stringify(record));
        await writable.close();
        return true;
    }catch(error){
        console.warn('OPFS 草稿写入失败',error);
        return false;
    }
}
async function requestPersistentDraftStorage(){

}
async function readBestDraftRecord(key,fileName){
    let dbRecord=null,opfsRecord=null;
    try{dbRecord=await draftDbRead(key);}catch(error){console.warn('IndexedDB 草稿读取失败',error);}
    opfsRecord=await draftOpfsRead(fileName);
    const records=[dbRecord,opfsRecord].filter(draftRecordValid).sort((a,b)=>Number(b.savedAt)-Number(a.savedAt));
    return records[0]||null;
}
function enqueueDraftWrite(key,fileName,record){
    draftWriteChain=draftWriteChain.catch(()=>{}).then(async()=>{
        const results=await Promise.allSettled([
            draftDbWrite(key,record),
            draftOpfsWrite(fileName,record)
        ]);
        const dbOk=results[0].status==='fulfilled';
        const opfsOk=results[1].status==='fulfilled'&&results[1].value!==false;
        if(!dbOk&&!opfsOk)throw new Error('草稿本地持久化失败');
    });
    return draftWriteChain;
}
function dataUrlFromFile(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result||''));
        reader.onerror=()=>reject(reader.error||new Error('读取待上传图片失败'));
        reader.readAsDataURL(file);
    });
}
async function serializePendingImages(editor){
    const result=[];
    const map=pendingMap(editor);
    for(const [token,pending] of map){
        let dataUrl=String(pending.draftDataUrl||'');
        if(!dataUrl){
            dataUrl=await dataUrlFromFile(pending.file);
            pending.draftDataUrl=dataUrl;
        }
        result.push({
            token,
            name:String(pending.file?.name||'image'),
            type:String(pending.file?.type||'application/octet-stream'),
            lastModified:Number(pending.file?.lastModified)||Date.now(),
            dataUrl
        });
    }
    return result;
}
async function restorePendingImages(editor,items){
    clearPendingUploads(editor);
    const map=pendingMap(editor);
    const validTokens=new Set();
    for(const item of Array.isArray(items)?items:[]){
        const token=String(item?.token||'');
        const dataUrl=String(item?.dataUrl||'');
        if(!/^img_[a-z0-9_-]+$/i.test(token)||!/^data:image\//i.test(dataUrl))continue;
        try{
            const blob=await (await fetch(dataUrl)).blob();
            const file=new File([blob],String(item.name||'image'),{
                type:String(item.type||blob.type||'image/*'),
                lastModified:Number(item.lastModified)||Date.now()
            });
            const previewUrl=URL.createObjectURL(file);
            map.set(token,{file,previewUrl,draftDataUrl:dataUrl});
            validTokens.add(token);
            const node=[...editor.querySelectorAll('img[data-upload-token]')].find(img=>img.getAttribute('data-upload-token')===token);
            if(node)node.setAttribute('src',previewUrl);
        }catch(error){console.warn('恢复待上传图片失败',error);}
    }
    for(const img of [...editor.querySelectorAll('img[data-upload-token]')]){
        const token=img.getAttribute('data-upload-token')||'';
        if(!validTokens.has(token))img.remove();
    }
}

async function restoreTestDraftsIfAny(){

    const [addRecord,editRecord]=await Promise.all([
        readBestDraftRecord(ADD_DRAFT_KEY,ADD_DRAFT_OPFS_FILE),

    ]);
    let restoredAdd=false,restoredEdit=false;
    if(addRecord?.kind==='draft'&&addRecord.draft?.mode==='add'){

    }
    if(editRecord?.kind==='draft'&&editRecord.draft?.mode==='edit'){
        restoredEdit=await applyEditDraft(editRecord.draft);
        if(!restoredEdit&&!restoredAdd){
            await applyAddDraft({...editRecord.draft,mode:'add'});
            restoredAdd=true;
        }
    }

    else if(restoredEdit)show('已恢复上次未提交的编辑草稿','info');
    else if(restoredAdd)show('已恢复上次未提交的草稿','info');
    return restoredAdd||restoredEdit;
}

// ---------- GitHub API ----------
async function githubApi(method,endpoint='',body=null){
    const owner=encodeURIComponent(config.owner);
    const repo=encodeURIComponent(config.repo);
    const suffix=endpoint?`/${endpoint}`:'';
    const url=`https://api.github.com/repos/${owner}/${repo}${suffix}`;
    const headers={
        'Authorization':`Bearer ${config.token}`,
        'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':API_VERSION
    };
    const options={method,headers};
    if(body!==null){
        headers['Content-Type']='application/json';
        options.body=JSON.stringify(body);
    }
    const response=await fetch(url,options);
    const raw=await response.text();
    let data=null;
    if(raw){
        try{data=JSON.parse(raw)}catch(e){data={message:raw}}
    }
    if(!response.ok){
        const error=new Error(data?.message||`HTTP ${response.status}`);
        error.status=response.status;
        error.payload=data;
        throw error;
    }
    return data;
}
function utf8ToBase64(text){
    const bytes=new TextEncoder().encode(text);
    let binary='';
    for(let i=0;i<bytes.length;i+=0x8000){
        binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    }
    return btoa(binary);
}
function base64ToUtf8(base64){
    const binary=atob(String(base64||'').replace(/\s/g,''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
}
async function verifyRepository(){
    // 先验证 Token 对目标仓库确实有访问权，避免仅凭本地存在 Token 就解锁内容。
    return githubApi('GET');
}
async function readRemote(){
    try{
        const data=await githubApi('GET',`contents/${pathEncode(config.file)}`);
        if(!data||data.type!=='file'||typeof data.content!=='string'||!data.sha){
            throw new Error('云端数据文件格式异常');
        }
        if(Number.isFinite(data.size)&&data.size>MAX_BYTES){
            throw new Error('云端数据超过 750 KB');
        }
        const parsed=JSON.parse(base64ToUtf8(data.content));
        return{
            exists:true,
            sha:data.sha,
            state:normalizeState(parsed)
        };
    }catch(error){
        if(error.status===404){
            return{exists:false,sha:null,state:[]};
        }
        throw error;
    }
}
async function writeRemote(snapshot,sha){
    const normalized=normalizeState(snapshot);
    const raw=JSON.stringify({schemaVersion:6,entries:normalized},null,2);
    if(new TextEncoder().encode(raw).length>MAX_BYTES){
        throw new Error('数据超过 750 KB');
    }
    const body={
        message:`更新 Test 数据 - ${new Date().toLocaleString()}`,
        content:utf8ToBase64(raw)
    };
    if(sha)body.sha=sha;
    const result=await githubApi('PUT',`contents/${pathEncode(config.file)}`,body);
    return result?.content?.sha||null;
}

// ---------- 附件 ----------
function attachmentBaseDir(){
    const file=clean(config.file)||PUBLIC_DATA_FILE;
    const normalized=file.replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
    const slash=normalized.lastIndexOf('/');
    return slash>=0?normalized.slice(0,slash):'';
}
function safeAttachmentName(name){
    const raw=String(name||'image').normalize('NFKC').replace(/[\/\\:*?"<>|\u0000-\u001f]/g,'_').trim();
    const safe=raw.replace(/^\.+/,'').slice(-120)||'image';
    return `${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
}
function attachmentRepoPath(folder,name){
    const valid=normalizeAttachmentFolder(folder);
    if(valid===null)throw new Error('图片附件缺少有效的 10 位 Unix 时间戳目录');
    return [attachmentBaseDir(),String(valid),name].filter(Boolean).join('/');
}
function attachmentPublicSrc(repoPath){return './'+String(repoPath).split('/').filter(Boolean).map(encodeURIComponent).join('/');}
function fileToBase64(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onerror=()=>reject(reader.error||new Error('读取图片失败'));
        reader.onload=()=>{
            const value=String(reader.result||'');
            const comma=value.indexOf(',');
            if(comma<0)return reject(new Error('图片编码失败'));
            resolve(value.slice(comma+1));
        };
        reader.readAsDataURL(file);
    });
}
async function uploadAttachment(folder,file){
    const name=safeAttachmentName(file.name);
    const repoPath=attachmentRepoPath(folder,name);
    const result=await githubApi('PUT',`contents/${pathEncode(repoPath)}`,{
        message:`上传 Test 附件 ${name}`,
        content:await fileToBase64(file)
    });
    if(!result?.content?.sha)throw new Error(`图片上传失败：${file.name}`);
    return{repoPath,src:attachmentPublicSrc(repoPath)};
}
async function deleteRepoTree(repoPath){
    let data;
    try{data=await githubApi('GET',`contents/${pathEncode(repoPath)}`);}catch(error){if(error.status===404)return;throw error;}
    const items=Array.isArray(data)?data:[data];
    for(const item of items){
        if(item?.type==='dir')await deleteRepoTree(item.path);
        else if(item?.type==='file'&&item.sha&&item.path){
            await githubApi('DELETE',`contents/${pathEncode(item.path)}`,{message:`删除 Test 附件 ${item.path}`,sha:item.sha});
        }
    }
}
async function deleteAttachmentFolder(folder){
    const valid=normalizeAttachmentFolder(folder);
    if(valid===null)return;
    await deleteRepoTree([attachmentBaseDir(),String(valid)].filter(Boolean).join('/'));
}

// ---------- 编辑登录 / 解锁写权限 ----------
async function login(showResult=true){
    if(!adminConfigured()){
        setUnlocked(false);
        if(publicLoaded||state.length)render();
        status(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · 编辑需 Token':'公开数据未加载 · 编辑需 Token';
        if(showResult)show('请填写仓库和 Token 以启用编辑','error');
        return false;
    }

    status('syncing','验证编辑权限…');
    syncBtn.disabled=true;
    exportBtn.disabled=true;
    importBtn.disabled=true;

    try{
        await verifyRepository();
        const remote=await readRemote();
        const remoteFp=fingerprint(remote.state);

        // 只有同一同步目标存在未同步本地修改时，才允许在验证成功后恢复缓存。
        const cache=loadCache();
        const sameTarget=meta.target===target();
        const cacheFp=fingerprint(cache);
        const cacheUnsynced=sameTarget&&meta.fingerprint!==null&&cacheFp!==meta.fingerprint&&cacheFp!==remoteFp;

        if(cacheUnsynced){
            state=cache;
            setUnlocked(true);
            render();

            if(remote.exists&&remoteFp!==meta.fingerprint){
                status('offline','存在同步冲突');
                lastSyncTime.textContent='编辑已登录 · 本地和云端均有修改';
                if(showResult)show('编辑登录成功，但检测到本地与云端均有修改，请点击“同步”处理','error');
            }else{
                status('offline','有未同步修改');
                lastSyncTime.textContent='编辑已登录 · 正在恢复未同步修改';
                scheduleSync();
                if(showResult)show('编辑登录成功，已恢复本地未同步修改','success');
            }
        }else{
            state=remote.state;
            setUnlocked(true);
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            if(!remote.exists)lastSyncTime.textContent='编辑已登录 · 数据文件尚未创建';
            if(showResult)show('Token 验证成功，已启用编辑','success');
        }

        await restoreTestDraftsIfAny();
        return true;
    }catch(error){
        console.error(error);
        setUnlocked(false);
        if(publicLoaded||state.length)render();
        status(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · Token 验证失败':'公开数据未加载 · Token 验证失败';
        if(showResult)show(`编辑登录失败：${formatError(error)}`,'error');
        return false;
    }
}

// ---------- 同步 ----------
async function sync(showResult=true,interactive=showResult){
    if(!unlocked||!adminConfigured()){
        show('请先使用 Token 登录','error');
        return false;
    }
    if(syncing)return false;

    clearTimeout(autoTimer);
    autoTimer=null;
    syncing=true;
    syncBtn.disabled=true;
    status('syncing','同步中…');

    try{
        const localSnapshot=normalizeState(state);
        const localFp=fingerprint(localSnapshot);
        const baseline=meta.target===target()?meta.fingerprint:null;
        const remote=await readRemote();

        if(!remote.exists){
            if(baseline!==null&&interactive){
                const recreate=confirm('云端数据文件已不存在。\n\n确定：用当前 Test 数据重新创建云端文件。\n取消：停止同步。');
                if(!recreate){
                    status('offline','同步已取消');
                    return false;
                }
            }else if(baseline!==null&&!interactive){
                status('offline','云端文件已删除');
                show('云端文件已删除，请点击“同步”决定是否重新创建','error');
                return false;
            }

            const sha=await writeRemote(localSnapshot,null);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            if(showResult)show('同步完成','success');
            return true;
        }

        const remoteFp=fingerprint(remote.state);

        if(localFp===remoteFp){
            record(localSnapshot,remote.sha);
            status('online','编辑已登录');
            if(showResult)show('本地与云端已一致','success');
            return true;
        }

        const localChanged=baseline===null||localFp!==baseline;
        const remoteChanged=baseline===null||remoteFp!==baseline;

        if(baseline!==null&&localChanged&&!remoteChanged){
            const sha=await writeRemote(localSnapshot,remote.sha);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            if(showResult)show('同步完成','success');
            return true;
        }

        if(baseline!==null&&!localChanged&&remoteChanged){
            state=remote.state;
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            if(showResult)show('已采用云端最新数据','success');
            return true;
        }

        if(!interactive){
            status('offline','存在同步冲突');
            show('本地和云端都发生了修改，请点击“同步”选择版本','error');
            return false;
        }

        const useLocal=confirm(
            '检测到本地和云端数据不同。\n\n' +
            '确定：用当前网页数据覆盖云端。\n' +
            '取消：继续选择是否采用云端数据。'
        );

        if(useLocal){
            const sha=await writeRemote(localSnapshot,remote.sha);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            show('已用当前网页数据覆盖云端','success');
            return true;
        }

        const useRemote=confirm(
            '是否采用云端数据覆盖当前网页？\n\n' +
            '确定：采用云端最新数据。\n' +
            '取消：暂不处理。'
        );

        if(useRemote){
            state=remote.state;
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            show('已采用云端数据','success');
            return true;
        }

        status('offline','同步已取消');
        show('未覆盖本地或云端数据','info');
        return false;
    }catch(error){
        console.error(error);
        status('offline','同步失败');
        show(`同步失败：${formatError(error)}`,'error');
        return false;
    }finally{
        syncing=false;
        syncBtn.disabled=!unlocked;
    }
}
function scheduleSync(){
    saveCache();
    if(!unlocked)return;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{
        autoTimer=null;
        sync(false,false);
    },AUTO_DELAY);
}
function markLocalChange(){
    render();
    status('offline','待同步');
    lastSyncTime.textContent='有未同步修改';
    scheduleSync();
}

// ---------- 富文本编辑 ----------
function selectionInside(editor){
    const sel=window.getSelection();
    if(!sel||sel.rangeCount===0)return false;
    const range=sel.getRangeAt(0);
    return editor.contains(range.startContainer)&&editor.contains(range.endContainer);
}
function currentBlock(editor){
    const sel=window.getSelection();
    let node=sel?.anchorNode||null;
    if(node&&node.nodeType===Node.TEXT_NODE)node=node.parentElement;
    while(node&&node!==editor){
        if(node.nodeType===Node.ELEMENT_NODE&&['P','DIV','LI','BLOCKQUOTE'].includes(node.tagName))return node;
        node=node.parentElement;
    }
    return null;
}
function ensureEditorSelection(editor){
    editor.focus();
    if(selectionInside(editor))return;
    const range=document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
}
function rememberEditorRange(editor){
    const sel=window.getSelection();
    if(!sel||sel.rangeCount===0)return false;
    const range=sel.getRangeAt(0);
    if(!editor.contains(range.startContainer)||!editor.contains(range.endContainer))return false;
    savedEditorRanges.set(editor,range.cloneRange());
    return true;
}
function restoreEditorRange(editor){
    editor.focus({preventScroll:true});
    const range=savedEditorRanges.get(editor);
    if(!range)return ensureEditorSelection(editor);
    try{
        if(!editor.contains(range.startContainer)||!editor.contains(range.endContainer))throw new Error('stale range');
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range.cloneRange());
    }catch(error){
        savedEditorRanges.delete(editor);
        ensureEditorSelection(editor);
    }
}
function createEditorParagraph(inheritIndent=false){
    const block=document.createElement('div');
    block.classList.add('editor-paragraph');
    if(inheritIndent)block.classList.add('first-line-indent');
    return block;
}
function tagNestedEditorParagraphs(container){
    for(const block of container.querySelectorAll('p,div')){
        // 只把最内层 P/DIV 视为一个自然段，避免把包裹多个段落的容器误当成单段。
        if(block.querySelector(':scope > p,:scope > div'))continue;
        block.classList.add('editor-paragraph');
    }
}
function normalizeEditorParagraphModel(editor){
    // contenteditable 的顶层 DOM 由浏览器决定：可能是裸文本、DIV、P、BR，
    // 甚至会出现“DIV 内再嵌 DIV”的段落结构。首行缩进不能依赖这些偶然结构。
    // 这里把普通正文统一成顶层 DIV.editor-paragraph；列表、引用、表格等结构块原样保留。
    const source=[...editor.childNodes];
    if(!source.length)return;

    const output=document.createDocumentFragment();
    let paragraph=null;
    let paragraphInheritedIndent=false;

    const ensureParagraph=(inheritIndent=false)=>{
        if(!paragraph){
            paragraph=createEditorParagraph(inheritIndent);
            paragraphInheritedIndent=inheritIndent;
        }else if(inheritIndent&&!paragraphInheritedIndent){
            paragraph.classList.add('first-line-indent');
            paragraphInheritedIndent=true;
        }
        return paragraph;
    };
    const flush=(forceBlank=false)=>{
        if(!paragraph&&forceBlank)paragraph=createEditorParagraph(false);
        if(!paragraph)return;
        if(!paragraph.childNodes.length)paragraph.appendChild(document.createElement('br'));
        output.appendChild(paragraph);
        paragraph=null;
        paragraphInheritedIndent=false;
    };
    const appendDirectText=(node,inheritIndent=false)=>{
        const value=String(node.nodeValue??'').replace(/\r\n?/g,'\n');
        if(!value.includes('\n')){
            ensureParagraph(inheritIndent).appendChild(node);
            return;
        }
        const parts=value.split('\n');
        node.remove();
        parts.forEach((part,index)=>{
            if(part)ensureParagraph(inheritIndent).appendChild(document.createTextNode(part));
            // 文本节点中的换行在 contenteditable 中同样可能代表自然段边界。
            if(index<parts.length-1)flush(true);
        });
    };

    const processNodes=(nodes,inheritIndent=false)=>{
        for(const node of nodes){
            if(node.nodeType===Node.TEXT_NODE){
                appendDirectText(node,inheritIndent);
                continue;
            }
            if(node.nodeType!==Node.ELEMENT_NODE){
                node.remove();
                continue;
            }

            const tag=node.tagName.toUpperCase();
            if(tag==='BR'){
                node.remove();
                flush(true);
                continue;
            }

            if(tag==='P'){
                flush();
                const block=createEditorParagraph(inheritIndent||node.classList.contains('first-line-indent'));
                while(node.firstChild)block.appendChild(node.firstChild);
                if(!block.childNodes.length)block.appendChild(document.createElement('br'));
                node.remove();
                output.appendChild(block);
                continue;
            }

            if(tag==='DIV'){
                const nestedParagraphs=[...node.children].some(child=>child.tagName==='P'||child.tagName==='DIV');
                if(nestedParagraphs){
                    // 浏览器有时把多个自然段嵌套进一个 DIV；把这个容器展开成真正的兄弟段落。
                    flush();
                    const children=[...node.childNodes];
                    const nextIndent=inheritIndent||node.classList.contains('first-line-indent');
                    node.remove();
                    processNodes(children,nextIndent);
                }else{
                    flush();
                    node.classList.add('editor-paragraph');
                    if(inheritIndent)node.classList.add('first-line-indent');
                    if(!node.childNodes.length)node.appendChild(document.createElement('br'));
                    output.appendChild(node);
                }
                continue;
            }

            if(['UL','OL','BLOCKQUOTE','TABLE','HR'].includes(tag)){
                flush();
                tagNestedEditorParagraphs(node);
                output.appendChild(node);
                continue;
            }

            // B/I/U/SPAN/IMG 等行内内容归入当前自然段。
            ensureParagraph(inheritIndent).appendChild(node);
        }
    };

    processNodes(source,false);
    flush();
    editor.replaceChildren(output);
}
function createSelectionMarker(kind){
    const marker=document.createElement('span');
    marker.dataset.editorSelectionMarker=kind;
    marker.setAttribute('aria-hidden','true');
    marker.style.cssText='display:inline-block;width:0;height:0;overflow:hidden;line-height:0;pointer-events:none;';
    return marker;
}
function insertSelectionMarkers(editor,range){
    const collapsed=range.collapsed;
    const startMarker=createSelectionMarker('start');
    const endMarker=collapsed?null:createSelectionMarker('end');

    if(endMarker){
        const endRange=range.cloneRange();
        endRange.collapse(false);
        endRange.insertNode(endMarker);
    }
    const startRange=range.cloneRange();
    startRange.collapse(true);
    startRange.insertNode(startMarker);
    return{startMarker,endMarker,collapsed};
}
function restoreSelectionFromMarkers(editor,bookmark){
    const{startMarker,endMarker,collapsed}=bookmark;
    const sel=window.getSelection();
    if(!sel||!startMarker.isConnected)return false;
    const range=document.createRange();
    if(collapsed){
        range.setStartBefore(startMarker);
        range.collapse(true);
    }else if(endMarker?.isConnected){
        range.setStartAfter(startMarker);
        range.setEndBefore(endMarker);
    }else return false;

    sel.removeAllRanges();
    sel.addRange(range);
    // Range 是 live range；移除标记后边界会自动贴回相邻真实内容。
    startMarker.remove();
    endMarker?.remove();
    editor.normalize();
    return true;
}
function normalizeEditorParagraphModelPreservingSelection(editor){
    const sel=window.getSelection();
    if(!sel||sel.rangeCount===0||!selectionInside(editor)){
        normalizeEditorParagraphModel(editor);
        return false;
    }
    const bookmark=insertSelectionMarkers(editor,sel.getRangeAt(0).cloneRange());
    normalizeEditorParagraphModel(editor);
    return restoreSelectionFromMarkers(editor,bookmark);
}
function editorParagraphForNode(editor,node){
    let current=node?.nodeType===Node.ELEMENT_NODE?node:node?.parentElement;
    while(current&&current!==editor){
        if(current.nodeType===Node.ELEMENT_NODE&&current.classList.contains('editor-paragraph'))return current;
        current=current.parentElement;
    }
    return null;
}
function paragraphsTouchedByBookmark(editor,bookmark){
    const{startMarker,endMarker,collapsed}=bookmark;
    const paragraphs=[...editor.querySelectorAll('.editor-paragraph')];
    if(collapsed){
        const block=editorParagraphForNode(editor,startMarker);
        return block?[block]:[];
    }
    if(!endMarker?.isConnected)return[];

    const startBlock=editorParagraphForNode(editor,startMarker);
    const endBlock=editorParagraphForNode(editor,endMarker);
    if(!startBlock||!endBlock)return[];
    const startIndex=paragraphs.indexOf(startBlock);
    const endIndex=paragraphs.indexOf(endBlock);
    if(startIndex<0||endIndex<0)return[];
    const from=Math.min(startIndex,endIndex);
    const to=Math.max(startIndex,endIndex);
    return paragraphs.slice(from,to+1);
}
function toggleFirstLineIndent(editor){
    restoreEditorRange(editor);
    const sel=window.getSelection();
    if(!sel||sel.rangeCount===0||!selectionInside(editor)){
        show('请将光标放在正文段落中，或选择一个/多个自然段','info');
        return;
    }

    // 先在真实选区两端插入标记，再重建段落模型。标记会随文字一起移动，
    // 因而不依赖浏览器点击工具栏后是否仍保留原 Range。
    const bookmark=insertSelectionMarkers(editor,sel.getRangeAt(0).cloneRange());
    normalizeEditorParagraphModel(editor);
    const blocks=paragraphsTouchedByBookmark(editor,bookmark);
    if(!blocks.length){
        restoreSelectionFromMarkers(editor,bookmark);
        show('没有识别到可缩进的自然段','info');
        return;
    }

    const shouldIndent=blocks.some(block=>!block.classList.contains('first-line-indent'));
    for(const block of blocks)block.classList.toggle('first-line-indent',shouldIndent);

    restoreSelectionFromMarkers(editor,bookmark);
    editor.dispatchEvent(new Event('input',{bubbles:true}));
    rememberEditorRange(editor);
}

function editorImageInput(editor){return editor===editContent?editImageInput:contentImageInput;}
function pendingMap(editor){let map=pendingUploads.get(editor);if(!map){map=new Map();pendingUploads.set(editor,map);}return map;}
function clearPendingUploads(editor){

function insertPendingImages(editor,files){

    const sel=window.getSelection();const range=sel&&sel.rangeCount?sel.getRangeAt(0):null;if(!range)return;

        fragment.appendChild(img);fragment.appendChild(document.createElement('br'));

function insertTable(editor){
    rememberEditorRange(editor);
    const rowsRaw=prompt('表格行数（1–20）','3');if(rowsRaw===null)return;
    const colsRaw=prompt('表格列数（1–12）','3');if(colsRaw===null)return;

    restoreEditorRange(editor);
    let html='<table><tbody>';
    for(let r=0;r<rows;r++){html+='<tr>';for(let c=0;c<cols;c++)html+=r===0?'<th>&nbsp;</th>':'<td>&nbsp;</td>';html+='</tr>';}
    html+='</tbody></table><p><br></p>';document.execCommand('insertHTML',false,html);editor.dispatchEvent(new Event('input',{bubbles:true}));

function hasPendingImages(editor){
    return Boolean(editor.querySelector('img[data-upload-token]'));
}
async function resolvePendingImages(editor,folder){
    const map=pendingMap(editor);const nodes=[...editor.querySelectorAll('img[data-upload-token]')];
    if(nodes.length&&normalizeAttachmentFolder(folder)===null)throw new Error('无法分配图片附件目录');
    for(const img of nodes){
        const token=img.getAttribute('data-upload-token');const pending=map.get(token);
        if(!pending)throw new Error('有图片尚未准备完成，请重新选择该图片');
        const uploaded=await uploadAttachment(folder,pending.file);img.setAttribute('src',uploaded.src);img.removeAttribute('data-upload-token');
        try{URL.revokeObjectURL(pending.previewUrl)}catch(e){}map.delete(token);
    }

}
function insertMathMarkup(editor,display=false){
    editor.focus();
    const sel=window.getSelection();
    let range=null;
    if(sel&&sel.rangeCount){
        const candidate=sel.getRangeAt(0);
        if(editor.contains(candidate.commonAncestorContainer))range=candidate;
    }
    if(!range){
        range=document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
    }
    const mark=display?'$$':'$';
    const selected=range.toString();
    const node=document.createTextNode(mark+selected+mark);
    range.deleteContents();
    range.insertNode(node);
    const caret=document.createRange();
    if(selected)caret.setStartAfter(node);
    else caret.setStart(node,mark.length);
    caret.collapse(true);
    if(sel){sel.removeAllRanges();sel.addRange(caret);}
    editor.dispatchEvent(new Event('input',{bubbles:true}));
}
function runEditorAction(editor,button){

    if(command)document.execCommand(command,false,null);

}
function setupEditorScrollIndicator(editor){
    const wrap=editor.closest('.rich-editor-wrap');
    if(!wrap)return;

    const track=document.createElement('div');
    const thumb=document.createElement('div');
    track.className='rich-editor-scrollbar';
    thumb.className='rich-editor-scrollbar-thumb';
    track.setAttribute('aria-hidden','true');
    track.appendChild(thumb);
    wrap.appendChild(track);

    let raf=0;
    let drag=null;

    const metrics=()=>{
        const clientHeight=editor.clientHeight;
        const scrollHeight=editor.scrollHeight;
        const trackHeight=Math.max(24,clientHeight-12);
        const thumbHeight=Math.max(34,Math.min(trackHeight,trackHeight*clientHeight/Math.max(scrollHeight,1)));
        const maxScroll=Math.max(0,scrollHeight-clientHeight);
        const maxThumbTravel=Math.max(0,trackHeight-thumbHeight);
        return{clientHeight,scrollHeight,trackHeight,thumbHeight,maxScroll,maxThumbTravel};
    };

    const update=()=>{
        raf=0;
        const m=metrics();
        const overflow=m.clientHeight>0&&m.scrollHeight>m.clientHeight+2;
        track.classList.toggle('visible',overflow);
        if(!overflow)return;

        const thumbY=m.maxScroll>0
            ? (editor.scrollTop/m.maxScroll)*m.maxThumbTravel
            : 0;

        track.style.top=`${editor.offsetTop+6}px`;
        track.style.height=`${m.trackHeight}px`;
        thumb.style.height=`${m.thumbHeight}px`;
        thumb.style.transform=`translateY(${thumbY}px)`;
    };

    const scheduleUpdate=()=>{
        if(raf)return;
        raf=requestAnimationFrame(update);
    };

    // 弹窗从 hidden 切换为可见后，显式触发此事件重新计算尺寸。
    editor.addEventListener('editor-scroll-refresh',scheduleUpdate);
    editor.addEventListener('scroll',scheduleUpdate,{passive:true});
    editor.addEventListener('input',scheduleUpdate);
    window.addEventListener('resize',scheduleUpdate,{passive:true});
    if(window.visualViewport){
        window.visualViewport.addEventListener('resize',scheduleUpdate,{passive:true});
    }
    if('ResizeObserver' in window){
        new ResizeObserver(scheduleUpdate).observe(editor);
    }
    new MutationObserver(scheduleUpdate).observe(editor,{childList:true,subtree:true,characterData:true});

    // 自定义滚动条可拖动；点击轨道也会跳转到对应位置。
    track.addEventListener('pointerdown',event=>{
        if(!track.classList.contains('visible'))return;
        event.preventDefault();
        const m=metrics();
        const rect=track.getBoundingClientRect();

        if(event.target===thumb){
            drag={
                pointerId:event.pointerId,
                startY:event.clientY,
                startScrollTop:editor.scrollTop,
                maxScroll:m.maxScroll,
                maxThumbTravel:m.maxThumbTravel
            };
            thumb.setPointerCapture?.(event.pointerId);
            return;
        }

        if(m.maxThumbTravel<=0||m.maxScroll<=0)return;
        const y=Math.max(0,Math.min(m.maxThumbTravel,event.clientY-rect.top-m.thumbHeight/2));
        editor.scrollTop=(y/m.maxThumbTravel)*m.maxScroll;
        scheduleUpdate();
    });

    thumb.addEventListener('pointermove',event=>{
        if(!drag||event.pointerId!==drag.pointerId)return;
        event.preventDefault();
        if(drag.maxThumbTravel<=0||drag.maxScroll<=0)return;
        const deltaY=event.clientY-drag.startY;
        editor.scrollTop=drag.startScrollTop+(deltaY/drag.maxThumbTravel)*drag.maxScroll;
        scheduleUpdate();
    });

    const endDrag=event=>{
        if(!drag||event.pointerId!==drag.pointerId)return;
        drag=null;
    };
    thumb.addEventListener('pointerup',endDrag);
    thumb.addEventListener('pointercancel',endDrag);

    scheduleUpdate();
}

function setupRichEditor(editor,toolbar,imageInput){
    setupEditorScrollIndicator(editor);

    // 工具栏点击前先冻结正文选区。pointerdown 覆盖鼠标、触控笔和触屏；
    // mousedown 仅作为旧浏览器兜底。这样跨段选区不会在点击按钮时被工具栏夺走。
    const preserveSelection=event=>{
        const button=event.target.closest('.editor-btn');
        if(!button)return;
        rememberEditorRange(editor);
        event.preventDefault();
    };
    toolbar.addEventListener('pointerdown',preserveSelection);
    toolbar.addEventListener('mousedown',preserveSelection);
    toolbar.addEventListener('click',event=>{
        const button=event.target.closest('.editor-btn');
        if(!button)return;
        restoreEditorRange(editor);
        runEditorAction(editor,button);
    });

    // 用户改变正文选区时持续保存最后一个有效 Range，供工具栏恢复。
    const saveSelection=()=>rememberEditorRange(editor);
    editor.addEventListener('pointerup',saveSelection);
    editor.addEventListener('keyup',saveSelection);
    editor.addEventListener('touchend',saveSelection,{passive:true});
    editor.addEventListener('focus',saveSelection);
    // 移动端拖动系统选区手柄时不一定触发 pointerup/keyup；selectionchange 才是可靠来源。
    document.addEventListener('selectionchange',()=>{
        if(selectionInside(editor))rememberEditorRange(editor);
    });

    // Enter 产生的新段落由浏览器先完成，再立即归一化并保持光标位置。
    editor.addEventListener('input',event=>{
        if(event.inputType==='insertParagraph'){
            normalizeEditorParagraphModelPreservingSelection(editor);
            rememberEditorRange(editor);
        }
    });

    imageInput.addEventListener('change',()=>{insertPendingImages(editor,imageInput.files||[]);imageInput.value='';});
    editor.addEventListener('paste',event=>{
        event.preventDefault();
        const plain=event.clipboardData?.getData('text/plain')||'';
        const html=event.clipboardData?.getData('text/html')||'';
        const text=clipboardTextForEditor(plain,html);
        document.execCommand('insertText',false,text);
        normalizeEditorParagraphModelPreservingSelection(editor);
        rememberEditorRange(editor);
    });
}

function importFile(file){

    if(file.size>MAX_BYTES){

    }
    const reader=new FileReader();
    reader.onload=e=>{
        try{

function updateBackToTopVisibility(){
    backToTopBtn.classList.toggle('visible',window.scrollY>240);
}

function fastScrollToTop(){
    const startY=window.scrollY;
    if(startY<=0)return;

    const duration=10;
    const startTime=performance.now();

    function step(now){
        const progress=Math.min((now-startTime)/duration,1);
        const eased=1-Math.pow(1-progress,3);
        window.scrollTo(0,Math.round(startY*(1-eased)));

        if(progress<1)requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
}

backToTopBtn.addEventListener('click',fastScrollToTop);
window.addEventListener('scroll',updateBackToTopVisibility,{passive:true});
updateBackToTopVisibility();

// ---------- 独立打印模块 ----------
(()=>{
    const btn=document.getElementById('printBtn');
    if(!btn)return;

    let printMode=false;

    function exitPrintMode(){
        printMode=false;
        document.body.classList.remove('print-select-mode');
        btn.textContent='打印';

        document.querySelectorAll('.print-check').forEach(el=>{
            el.checked=false;
        });

        if(typeof render==='function')render();
    }

    function selectedPrintItems(){
        const ids=[...document.querySelectorAll('.print-check:checked')]
            .map(el=>el.dataset.printId);

        if(!Array.isArray(state))return [];
        return state.filter(item=>ids.includes(item.id));
    }

    function openPrintPage(items){
        const win=window.open('','_blank');
        if(!win)return;

        win.document.write(`
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF</title>
<style>
@page{margin:20mm}
body{
 font-family:"Microsoft YaHei",sans-serif;
 line-height:1.8;
}
.print-item{
 margin-bottom:36px;
 page-break-inside:avoid;
}
</style>
</head>
<body>
${items.map(item=>`<div class="print-item">${item.content||''}</div>`).join('')}
</body>
</html>`);

        win.document.close();

        setTimeout(()=>{
            win.print();
            win.onafterprint=()=>{
                exitPrintMode();
            };
        },500);
    }

    btn.addEventListener('click',()=>{
        if(!printMode){
            printMode=true;
            document.body.classList.add('print-select-mode');
            btn.textContent='生成PDF';
            if(typeof render==='function')render();
            return;
        }

        const items=selectedPrintItems();

        if(!items.length){
            if(typeof showToast==='function')
                showToast('请先选择条目','error');
            return;
        }

        openPrintPage(items);
    });

    window.exitPrintMode=exitPrintMode;
})();

</script>
